# GNOME settings captured from desk 2026-10-06; loaded by the manifest gnome-dconf script.
[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/obsidian-borg/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openshotx-area/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openshotx-screen/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openshotx-ocr/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openshotx-gif/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/handy-transcribe/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openwhispr/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/handy-transcribe]
binding='<Control>space'
command='handy --toggle-transcription'
name='Handy Transcribe'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/obsidian-borg]
binding='<Ctrl><Shift>b'
command='/home/saidler/.cargo/bin/obsidian-borg ingest --clipboard'
name='obsidian-borg'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openshotx-area]
binding='Print'
command='/home/saidler/.cargo/bin/openshotx capture area'
name='OpenShotX: Capture Area'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openshotx-gif]
binding='<Shift><Super>Print'
command='/home/saidler/.cargo/bin/openshotx record area --gif'
name='OpenShotX: Record Area GIF'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openshotx-ocr]
binding='<Super>Print'
command='/home/saidler/.cargo/bin/openshotx capture area --ocr'
name='OpenShotX: Capture Area OCR'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openshotx-screen]
binding='<Control>Print'
command='/home/saidler/.cargo/bin/openshotx capture screen'
name='OpenShotX: Capture Screen'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openwhispr]
binding='F8'
command='dbus-send --session --type=method_call --dest=com.openwhispr.App /com/openwhispr/App com.openwhispr.App.Toggle'
name='OpenWhispr Toggle'
