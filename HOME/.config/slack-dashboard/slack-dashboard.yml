server:
  port: 8889
  log-level: info

llm:
  provider: anthropic
  model: claude-haiku-4-5-20251001
  api-key: "${ANTHROPIC_API_KEY}"

# jev (TypeSafe systemone): rates each thread once, and again when it grows, for the topic
# terms under heat. keep stores the key as ESCOTE_TYPESAFE_API_KEY; map it at launch.
topics:
  api-key: ${TYPESAFE_API_KEY}
  model: jev-1.14.0

display:
  compact-rows: 20
  # One glyph per mark slot, in render order; a key left out keeps the code default.
  marks:
    leader: "👔"
    access: "🔑"
    incident: "🚨"
    resolved: "✅"
    social: "🎉"
    following: "🔔"
    vip: "👑"
    new: "✨"
    spiking: "📈"
    heated: "🌶️"
    revived: "⏪"
    unanswered: "❓"
