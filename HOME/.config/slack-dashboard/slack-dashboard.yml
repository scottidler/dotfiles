slack:
  token: "${SLACK_DASHBOARD_SLACK_USER_TOKEN}"
  app-token: "${SLACK_DASHBOARD_SLACK_APP_TOKEN}"
  # team-id makes row clicks open the native desktop app (slack://) instead of web.
  team-id: "${SLACK_TEAM_ID}"

fetch:
  refresh-interval-minutes: 10
  min-replies: 3

heat:
  max-thread-age-days: 3

  # Glyph knobs (Triage v3.1). velocity-weight must be materially non-zero so the
  # spiking glyph and the score agree; unanswered enabled for Monday observation.
  velocity-weight: 5.0
  spiking-threshold: 15
  new-window-minutes: 60
  unanswered-enabled: true
  unanswered-max-replies: 2
  unanswered-min-age-hours: 2

  # Following: a thread Slack follows for me (started, commented, @'d, followed; the 🔔
  # mark) is one Slack already tells me about. Flat drop, no rebuild: the board is for
  # the threads Slack will not tell me about.
  followed-drop: 0.2
  followed-rebuild-per-msg: 0

  # The autoresearch keeps (docs/design/2026-10-18-heat-autoresearch.md), measured on four
  # weeks of this board against the threads I stepped into: 0.51 -> 0.59 on the tuning
  # weeks, 0.49 -> 0.60 on the held-out week. Each one is a sentence about me:
  # heat is a morning thing (half a working hour, hyperbolic tail); a thread that needs a
  # leader is full-size, escapes the gate, and keeps its heat longer; an answered thread
  # leaves the board.
  atrophy-curve: hyperbolic
  atrophy-half-life-work-hours: 0.5
  atrophy-leader-stretch: 1.0
  leader-weight: 45
  leader-gate-floor: 0.3
  resolved-drop: 1.0

  # Channel importance (glob-aware; exact keys beat globs; default 1.0). Weights only
  # REORDER (zero-miss: nothing is dropped). Tiers by who is in the room, from persona
  # and Slack membership (2026-10-18): my direct reports first, my teams' internal
  # channels next, rooms shared with my manager and peers after that, then partner and
  # ops channels, noise below 1.0. Measured with the tuned formula: ties the old weights
  # on the tuning weeks, +7 points on the held-out week.
  channel-weights:
    # 3.0: my direct reports
    security-internal: 3.0
    platform-leadership: 3.0
    # 2.6: my teams' internal channels
    sre-internal: 2.6
    data-platform-internal: 2.6
    platform-internal: 2.6
    # 2.2 to 2.4: my manager and peer directors
    engineering-leadership: 2.4
    tech-staff-team: 2.2
    engineering-mgmt: 2.2
    # 2.0: security partner room and active ops
    it-security: 2.0
    incidents: 2.0
    # 1.2 to 1.6: rooms with peers and reports among many others
    opex-monthly: 1.6
    sre-sec: 1.5
    ask-security: 1.4
    sre: 1.3
    data-platform: 1.3
    eng-on-call: 1.3
    sre-it: 1.2
    # 1.0: partner and review rooms
    sre-solutions: 1.0
    it-helpdesk: 1.0
    tech-spec-reviews: 1.0
    # below 1.0: kept visible, ranked down
    engineering: 0.8
    ai-foundry: 0.7
    ai-technical: 0.7
    enterprise-ai-onboarding-and-configuration: 0.6
    backstage: 0.6
    proj-mintlify: 0.6
    staging-env: 0.5
    cloud-costs: 0.5

  # Per-person importance, keyed by stable Slack user_id (glob-aware; default = participant-weight).
  # Raises specific people so a thread they are in floats up; additive into base, bounded by
  # people-weight-cap. PRIVATE: real ids/weights live only here, never in the public repo.
  # Unresolved (no Slack user_id observed yet; token lacks search scope): Muller Luo (12,
  # muller@), Tony O'Dell (10, tony.odell@) - add their ids when known.
