slack:
  token: "${SLACK_DASHBOARD_SLACK_USER_TOKEN}"
  app-token: "${SLACK_DASHBOARD_SLACK_APP_TOKEN}"
  # team-id makes row clicks open the native desktop app (slack://) instead of web.
  team-id: "${SLACK_TEAM_ID}"

fetch:
  refresh-interval-minutes: 10
  min-replies: 3

heat:
  decay-half-life-hours: 24
  max-thread-age-days: 3

  # Glyph knobs (Triage v3.1). velocity-weight must be materially non-zero so the
  # spiking glyph and the score agree; unanswered enabled for Monday observation.
  velocity-weight: 5.0
  spiking-threshold: 15
  new-window-minutes: 60
  unanswered-enabled: true
  unanswered-max-replies: 2
  unanswered-min-age-hours: 2

  # Involvement damping (v3.3): a thread I have RECENTLY posted in (👤) is lower priority -
  # I already weighed in. Strongest right after my post, fades back to none as my message
  # is buried by later messages AND as time passes (heat *= 1 - involved-damping * msg-fade
  # * time-fade). involved-damping is the peak cut (0 = off, 0.5 = halve, 1 = zero out).
  involved-damping: 0.5
  involved-decay-messages: 10
  involved-decay-hours: 24.0

  # Channel importance (glob-aware; exact keys beat globs; default 1.0). Weights only
  # REORDER (zero-miss: nothing is dropped), pushing my orgs to the top of the compact view.
  # Tiers: T1 = my orgs (SRE, Data Platform, Security-reports-to-me) + incidents/on-call;
  # T2 = broader engineering (boss Mark, peer Directors Reno/Toussaint, primary customers);
  # secondary = Data Science (Jena/Tim) adjacent; noise = helpdesk/ops kept visible but low.
  channel-weights:
    # T1 - my own orgs + active ops
    incidents: 3.0
    sre-sec: 2.8
    sre*: 2.5
    ask-security: 2.5
    data-platform*: 2.6
    eng-on-call: 2.2
    platform-internal: 2.0
    # IT - close partner team, ranks high (sre-it already covered by sre* above)
    it-helpdesk: 1.6
    # T2 - broader engineering / peer directors / primary customers
    engineering-mgmt: 1.4
    engineering: 1.3
    tech-spec-reviews: 1.2
    scrum-of-scrums: 1.0
    # secondary - data-science / ML adjacent
    ai-foundry: 0.9
    ai-technical: 0.9
    # lower - other teams kept visible (zero-miss) but ranked down
    backstage: 0.6
    cloud-costs: 0.5
    staging-env: 0.5
    opex-monthly: 0.4

  # Per-person importance, keyed by stable Slack user_id (glob-aware; default = participant-weight).
  # Raises specific people so a thread they are in floats up; additive into base, bounded by
  # people-weight-cap. PRIVATE: real ids/weights live only here, never in the public repo.
  # Unresolved (no Slack user_id observed yet; token lacks search scope): Muller Luo (12,
