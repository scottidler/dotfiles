# Lower the enrichment dormancy horizon to 1d (clyde's CLI default is 7d).
# Paired with harvest.dormant-after: 1d in ~/.config/sb/borg.yml - borg's
# selection gate requires enrich-status ok, so sessions only land in the
# vault once BOTH horizons have passed. A drop-in (not a unit edit) so
# `clyde bootstrap` refreshing clyde-enrich.service never reverts it.
[Service]
ExecStart=
ExecStart=%h/.cargo/bin/clyde --log-level info session enrich --dormant-after 1d
