# snapd-desktop-integration fails at login ("Failed to open display") and its
# own Restart=on-failure recovers it 2s later. RestartMode=direct skips
# OnFailure= during that auto-restart, so only a unit that gives up alerts.
# StartLimitIntervalSec=60: the shipped 10s window never fills at RestartSec=2s,
# so a unit failing forever would restart silently forever under direct. With
# 60s, 5 failed starts hit the limit and OnFailure fires once (Phase 0 Spike A
# proved both, docs/design/2026-10-10-stop-time-failure-alerts-implementation-notes.md).
# A per-unit drop-in, never fleet-wide: cortex's crash loop (RestartSec=5) never
# hits its start limit and must keep alerting.
[Unit]
StartLimitIntervalSec=60

[Service]
RestartMode=direct
