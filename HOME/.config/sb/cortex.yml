vault:
  root-path: ~/repos/scottidler/obsidian/
  ignore:
    - ".git"
    - ".obsidian"
    - ".cortex"
    - "assets"
    - "attachments"
    - ".claude"
    - "templates"
  exclude:
    - "CLAUDE.md"
    - "README.md"
    - "system/**"
  include:
    - "system/2026-*.md"
    - "system/design-*.md"
    - "notes/ai/**"

log-level: info

actions:
  naming:
    style: lowercase-hyphenated
    max-length: 80
    exempt-patterns:
      - "^[\\p{Emoji}].*/$"

  frontmatter:
    required: [title, date, type, domain, origin, tags]
    exempt:
      daily: [domain]
    path-exempt:
      "inbox/**": [domain, origin, tags]
      "notes/ai/**": [domain, origin]
      "entities/**": [domain, origin]
    type-fields:
      youtube: [source, creator, duration]
      video: [source, creator, duration]
      article: [source, creator]
      github: [source]
      social: [source]
      research: [source]
      book: [creator]
      meeting: [scope, company]
      link: [source]
    auto-title: true

  tags:
    style: lowercase-hyphenated
    canonical:
      - ai-llm
      - sre
      - kubernetes
      - football
      - obsidian
      - rust
      - python
      - nixos
      - writing
      - music
      - spanish
    aliases:
      ai: ai-llm
      ML: ai-llm
      ml: ai-llm
      k8s: kubernetes
      kube: kubernetes
      nix: nixos

  scope:
    rules:
      - match: { tags: [sre, dat, tatari, engprog] }
        set: { scope: work, company: tatari }
      - match: { source-contains: "granola" }
        set: { scope: work, confidential: true }

  linking:
    scan-for: [people, projects, concepts]
    entities:
      people: []
      projects: []
    min-word-length: 5
    targets:
      types:
        exclude: [daily, youtube, article, book, video, social, research, link, system]
        include: []
      paths:
        exclude: ["journal/", "inbox/"]
        include: []

  intel:
    daily-note: true
    weekly-review: true
    fabric-patterns: [extract_wisdom, summarize]
    output-path: "notes/ai"

  duplicates:
    threshold: 0.85
    same-type-only: false
    exclude:
      - "journal/**"

  auto-tag:
    enabled: true
    min-tags-threshold: 3

  broken-links:
    check-wikilinks: true
    check-urls: false

state:
  cache-dir: ".cortex"

graph:
  # Typed fact-edge coverage. Triple extraction has no advancing cursor, so the
  # cap IS the window: set it above the ingested-note count (729 today) to mine
  # the whole corpus each pass rather than re-mining the first 50.
  fact-max-per-run: 1000
  # In-process weekly backfill of the LLM fact layer. Deterministic edges are
  # maintained separately on the 15-min graph tick; this refreshes only facts.
  fact-interval-secs: 604800
  # Common words that must never mint a wikilink hub-membership edge. Consulted
  # at edge-build time on the raw [[target]], before path resolution, so a
  # backfill cannot reinstate them. "every" matched 569 times purely because
  # the every.to creator hub has a 5-char title under linking.min-word-length.
  # Hub names the auto-linker must never target, the graph must never mint an
  # edge from, and `sb cortex unlink` may retract. Curated by the `hub-hygiene`
  # skill, which measures each single-token hub's proper-noun ratio (share of
  # prose uses written capitalized mid-sentence) rather than guessing. Full
  # audit: notes/entity-hub-linkability-audit.md. These 16 all sit at or below
  # 31%; everything kept is above 55% or not an English word at all.
  wikilink-stopwords:
    # ordinary words that happen to name a topic hub
    - agents
    - architecture
    - automation
    - coaching
    - database
    - design
    - embeddings
    - football
    - infrastructure
    - productivity
    - programming
    - security
    - workflow
    # ordinary words carrying ontotype: creator (Every.to, a channel named
    # "Brief", and a mis-typed entity)
    - brief
    - every
    - syntax

daemon:
  debounce-secs: 5
  watch: notify
  poll-interval: 300
  daily-at: "M-F 07:00"
  weekly-at: "Sun 22:00"
  # Rayon cap emitted into the installed unit as RAYON_NUM_THREADS. This pool
  # serves the GOVERNANCE actions (classify/lint/link/quality/auto-tag); embed
  # inference now runs in its own pool (embed.workers) and can no longer starve
  # it. Halved 8 -> 4 on 2026-07-20 after a runaway; raised to 12 on 2026-08-18
  # once the starvation root cause was found: 4 was throttling all governance to
  # protect against a runaway that pool isolation is the correct guard for.
  # desk has 32 cores; 12 governance + 2 embed leaves ample headroom.
  rayon-threads: 12
  # Secret bootstrap: command stdout captured into env-file via ExecStartPre,
  # then loaded with EnvironmentFile. Reproduces the pre-existing hand-added unit lines.
  env-bootstrap:
    command: /home/saidler/.cargo/bin/manifest -C /home/saidler/repos/scottidler/keep/manifest.yml secrets env -f env
    env-file: /run/user/1000/cortex.env
  actions:
    classify:
      enable: true
    lint:
      enable: true
    broken-links: {}
    link:
      enable: true
    duplicates:
      enable: true
    quality:
      enable: true
    auto-tag: {}
    sweep:
      enable: true
    state: {}
    intel:
      enable: true

# Embedding generation (cortex is the only writer to note_embeddings).
#
# desk is AVX-only: /proc/cpuinfo reports `avx sse4_1 sse4_2` with NO avx2 and
# NO fma, so gemm has no vectorized f32 microkernel and candle's MatMul runs on
# `gemm_f32::microkernel::scalar` - roughly an order of magnitude off a modern
# box. That is a hardware floor, not a tuning problem (and fastembed/ONNX is not
# the escape hatch: `vault/Cargo.toml` pins `vec = ["vec-candle"]` precisely
# because the ONNX backend has an AVX2 floor this CPU cannot meet).
#
# Slow is therefore accepted. What is NOT accepted is slow inference taking the
# governance loop down with it: on 2026-08-16 20:48 a single embed tick ran for
# two days, held all 4 rayon workers, and starved classify so 50 harvested
# session notes sat unfiled in inbox/ while systemd still reported the daemon
# `active (running)`.
embed:
  # Dedicated inference pool size. Was 0 = "let the backend pick", which chose
  # min(8, available_parallelism) = 8 replicas on this 32-core box, all
  # contending for the 4-thread global rayon pool. Pinned at 2: on the scalar
  # kernel more replicas buy nothing and only widen the contention window.
  workers: 2
  # Hard ceiling on chunks embedded per tick. The tick's batch-size bounds
  # NOTES (64), not chunks, and one long transcript can chunk into hundreds -
  # which is how a single tick became a two-day job with no log line between
  # start and finish. Bounding chunks makes each tick's wall-clock predictable
  # and spreads the same work across ticks instead of one unbounded run.
  max-chunks-per-tick: 512

migrations:
  - name: v2-field-renames
    field-renames:
      url: source
      author: creator
      uploader: creator
      channel: creator
      duration_min: duration
      trace_id: trace
      folder: domain
    field-drops: [day, time, ww, ref]
  - name: v3-domain-expansion
    value-renames:
      domain:
        knowledge: life
  - name: v4-legacy-values
    value-renames:
      origin: { human: authored, ai-generated: generated }
      status: { resolved-workaround: reviewed }

llm:
  provider: claude
  model: claude-sonnet-5
  api-key: ESCOTE_ANTHROPIC_API_KEY

fabric:
  # mise-managed shim (matches borg.yml); self-resolves the pinned version
  # under the daemon's stripped PATH. Explicit here because retiring the
  # hand-built ~/.local/bin/fabric would otherwise leave `which fabric` empty.
  binary: /home/saidler/.local/share/mise/shims/fabric
